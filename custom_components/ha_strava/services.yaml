update_activity:
  name: Update Activity
  description: >-
    Update an existing Strava activity. Supports modifiable fields from the Strava
    UpdatableActivity model. Requires the `activity:write` OAuth scope. If missing,
    re-authenticate the integration when prompted (you do not need to remove and re-add it).
  fields:
    activity_id:
      name: Activity ID
      description: The numeric Strava activity ID to update.
      required: true
      example: "1234567890"
      selector:
        text:
    sport_type:
      name: Sport Type
      description: The sport type for the activity.
      required: false
      example: Run
      selector:
        select:
          options:
            - AlpineSki
            - BackcountrySki
            - Badminton
            - Basketball
            - Canoeing
            - Cricket
            - Crossfit
            - Dance
            - EBikeRide
            - Elliptical
            - EMountainBikeRide
            - Golf
            - GravelRide
            - Handcycle
            - HighIntensityIntervalTraining
            - Hike
            - IceSkate
            - InlineSkate
            - Kayaking
            - Kitesurf
            - MountainBikeRide
            - NordicSki
            - Padel
            - Pickleball
            - Pilates
            - Racquetball
            - Ride
            - RockClimbing
            - RollerSki
            - Rowing
            - Run
            - Sail
            - Skateboard
            - Snowboard
            - Snowshoe
            - Soccer
            - Squash
            - StairStepper
            - StandUpPaddling
            - Surfing
            - Swim
            - TableTennis
            - Tennis
            - TrailRun
            - Velomobile
            - VirtualRide
            - VirtualRow
            - VirtualRun
            - Volleyball
            - Walk
            - WeightTraining
            - Wheelchair
            - Windsurf
            - Workout
            - Yoga
    name:
      name: Name
      description: The name of the activity.
      required: false
      example: "Morning Run"
      selector:
        text:
    description:
      name: Description
      description: The description of the activity.
      required: false
      selector:
        text:
          multiline: true
    gear_id:
      name: Gear ID
      description: The Strava gear ID to associate with the activity.
      required: false
      example: "b1234567"
      selector:
        text:
    trainer:
      name: Trainer
      description: Whether the activity was performed on a trainer.
      required: false
      selector:
        boolean:
    commute:
      name: Commute
      description: Whether the activity is a commute.
      required: false
      selector:
        boolean:
    hide_from_home:
      name: Hide from Home
      description: Whether to hide the activity from the Strava home feed.
      required: false
      selector:
        boolean:
    private_note:
      name: Private Note
      description: >-
        A private note visible only to the athlete. Not in Strava's official
        UpdatableActivity docs but accepted by the API.
      required: false
      selector:
        text:
          multiline: true

get_activity_route:
  name: Get Activity Route
  description: >-
    Decode an activity's stored polyline (map.summary_polyline) into a list of
    latitude/longitude coordinates. Returns the route on demand instead of storing
    decoded coordinates in sensor attributes, keeping recorder history small.
  fields:
    activity_id:
      name: Activity ID
      description: The numeric Strava activity ID to fetch the route for.
      required: true
      example: "1234567890"
      selector:
        text:

get_activity:
  name: Get Activity by ID
  description: >-
    Fetch one activity using an explicitly selected account, without the recent-activity
    sensor cache. Checks the returned activity owner. No recurring polling is added.
  fields:
    config_entry_id:
      name: Strava account
      required: true
      selector:
        config_entry:
          integration: ha_strava
    activity_id:
      name: Activity ID
      required: true
      selector:
        text:

edit_activity:
  name: Preview or Edit Activity
  description: >-
    Explicit account-scoped edits with ownership checks, serialized changes and read-back
    verification. Preview is the default. Use append_description for an idempotent annotation,
    or changes for documented fields. Requires activity:write to perform actual updates.
  fields:
    config_entry_id:
      name: Strava account
      required: true
      selector:
        config_entry:
          integration: ha_strava
    activity_id:
      name: Activity ID
      required: true
      selector:
        text:
    changes:
      name: Changes
      default: {}
      selector:
        object:
    append_description:
      name: Append to description
      description: Append an exact line block once, preserving existing notes. Cannot be combined with changes.
      selector:
        text:
          multiline: true
    expected_description:
      name: Expected current description
      description: For replacement edits, reject the write if the current description differs from this snapshot.
      selector:
        text:
          multiline: true
    dry_run:
      name: Preview only
      default: true
      selector:
        boolean:
