name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v2"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements_dev.txt
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest
